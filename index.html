#title{font-family:"GTitle","Segoe UI",Arial,sans-serif;font-weight:700;font-size:36px;line-height:1.15;color:#c8892b;letter-spacing:.5px;text-shadow:2px 3px 0 #ecd5a0}
html[lang=en] #title{font-weight:400;font-size:34px}
#poster h1{font-family:"GTitle","Segoe UI",Arial,sans-serif;color:#b8861b;font-weight:700;font-size:16mm;text-shadow:.5mm .7mm 0 #e9d29a}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Segoe UI",Arial,"Noto Sans Hebrew",sans-serif;background:radial-gradient(1200px 700px at 80% -10%,#f6e6c6 0,transparent 60%),var(--bg);color:var(--text);min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;flex-wrap:wrap}
h1{font-size:22px;margin:0;font-weight:700;letter-spacing:.2px}
h1 small{display:block;color:var(--mut);font-weight:400;font-size:13px;margin-top:2px}
.btn{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:14px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.gold{background:var(--gold);color:#ffffff;border-color:var(--gold);font-weight:600}
.btn.sm{padding:5px 10px;font-size:12.5px}
.mk{color:var(--accent);font-size:11.5px;font-weight:700}
#upHint{display:none;align-items:center;justify-content:center;gap:6px;color:var(--mut);font-size:12px;padding:0 14px 8px}#upHint b{color:var(--gold);font-size:15px}
#upcoming{display:flex;gap:10px;overflow-x:auto;padding:18px 20px 14px;scrollbar-width:thin}
.up{flex:0 0 auto;min-width:300px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;cursor:pointer}
.up:hover{border-color:var(--accent)}
.up.today{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.up .t{font-size:12px;color:var(--mut)}
.up .body{display:grid;gap:2px}
.up .r{display:flex;justify-content:space-between;gap:14px;align-items:baseline}
.up .n{margin-bottom:2px}
.up .n{font-weight:600;font-size:15px}
.up .c{font-size:13px;color:var(--gold);font-variant-numeric:tabular-nums}
.av{position:relative;width:42px;height:42px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-weight:700;color:#2e2a26;background-size:cover;background-position:center;font-size:18px}
.av.crown::after{content:"👑";position:absolute;top:-16px;left:50%;transform:translateX(-50%) rotate(-8deg);font-size:21px;line-height:1}
#card .av.crown::after{top:-30px;font-size:38px}
nav{display:flex;gap:6px;padding:0 20px;flex-wrap:wrap}
nav button{background:transparent;color:var(--mut);border:0;border-bottom:2px solid transparent;padding:10px 14px;font-size:15px;cursor:pointer}
nav button.on{color:var(--text);border-bottom-color:var(--gold)}
main{padding:14px 20px 40px}
.tab{display:none}.tab.on{display:block}
#treeWrap,#zWrap{position:relative;background:linear-gradient(#fffaf0,#f4ead8);border:1px solid var(--line);border-radius:18px;overflow:hidden;height:min(72vh,640px);touch-action:none}
#tree,#zcv{width:100%;height:100%;display:block;cursor:grab}
#tree:active,#zcv:active{cursor:grabbing}
.ctrl{position:absolute;inset-block-end:12px;inset-inline-start:12px;display:flex;gap:6px}
.hint{position:absolute;inset-block-start:10px;inset-inline-end:14px;color:var(--mut);font-size:12.5px}
.lvl{position:absolute;inset-inline-start:14px;color:#a09481;font-size:12px}
#zwrap{max-width:640px;margin:0 auto}
#zsvg{width:100%;height:auto;display:block}
.cal{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.box h3{margin:0 0 8px;font-size:16px}
.box p{color:var(--mut);font-size:13.5px;line-height:1.55;margin:6px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.plist{display:grid;gap:8px;margin-top:6px}
.pl{display:flex;align-items:center;gap:10px;background:#f6eddc;border-radius:12px;padding:8px 10px}
.pl .n{flex:1;font-size:14px}
#dlg{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
#dlg.on{display:flex}
#card{background:var(--bg2);border:1px solid var(--line);border-radius:20px;max-width:440px;width:100%;max-height:92vh;overflow:auto;padding:20px}
#card .top{display:flex;gap:14px;align-items:center}
#card .av{width:78px;height:78px;font-size:32px}
#card h2{margin:0;font-size:20px}

#zPanel .zh{display:flex;gap:12px;align-items:center}#zPanel .zg{font-size:40px;line-height:1;font-family:"Segoe UI Symbol",Arial;text-shadow:0 2px 6px rgba(0,0,0,.15)}
#zPanel .zh b{display:block;font-size:19px}#zPanel .zh small{color:var(--mut);font-size:12.5px}
#zPanel .zt{margin:10px 0 8px;padding:8px 10px;border-radius:12px;background:linear-gradient(135deg,#fbecc8,#f5dfae);color:#7a4f12;font-weight:600;font-size:13.5px;text-align:center}
#zPanel .zm{font-size:12.5px;color:var(--mut);margin:4px 2px 6px}
#zPanel .zl{display:grid;gap:6px}#zPanel .zi{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:12px;background:rgba(246,237,220,.7);cursor:pointer;transition:transform .15s}
#zPanel .zi:hover{transform:translateX(-3px);background:#f3e2bf}#zPanel .zi span{flex:1;font-weight:600;font-size:14px}#zPanel .zi small{color:var(--gold);font-weight:600}#zPanel .zi .av{width:34px;height:34px;font-size:15px}
#zPanel .zn{color:var(--mut);font-size:13px;text-align:center;padding:10px}
.ctrl .btn{white-space:nowrap}@media(max-width:700px){.ctrl{inset-inline-start:8px;inset-block-end:8px;gap:4px}.ctrl .btn.sm{padding:4px 9px;font-size:12px;min-height:28px}}

#pvw{position:fixed;inset:0;z-index:140;background:rgba(46,34,20,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:16px}
#pvw.on{display:flex;animation:fadeIn .25s ease both}
#pvw .pvIn{background:linear-gradient(180deg,#fffdf8,#f7eedd);border-radius:24px;box-shadow:0 30px 80px rgba(0,0,0,.4);width:min(1200px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;animation:cardIn .45s var(--ease) both}
#pvw .pvBar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;flex-wrap:wrap}#pvw .pvBar b{color:#b0731c;font-size:17px}
#pvw .pvB{display:flex;gap:8px;flex-wrap:wrap}
#pvw .pvStage{padding:0 16px 16px;overflow:auto;display:flex;justify-content:center;align-items:center;min-height:200px}
#pvw .pvCv{width:100%;height:auto;max-height:calc(100vh - 140px);object-fit:contain;border-radius:10px;box-shadow:0 8px 30px rgba(90,60,20,.25)}
#pvw .pvWait{color:var(--mut);padding:60px}
@media(max-width:700px){#posterBtn{display:inline-flex!important}#posterBtn .plb{display:none}#posterBtn{width:36px;height:36px;padding:0;align-items:center;justify-content:center}#pvw{padding:8px}#pvw .pvBar .btn{font-size:12.5px;padding:6px 10px}}
@media print{@page{size:A3 landscape;margin:0}#poster img{display:block;width:420mm;height:297mm}}

#pvw .pvStage{flex-direction:column;gap:10px}#pvw .pvNote{color:var(--mut);font-size:12.5px}
@media(max-width:700px){#pvw .pvGrid{grid-template-columns:repeat(2,1fr);gap:10px}}
.gnew{position:relative}.gnew::after{content:"NEW";position:absolute;top:10px;inset-inline-end:10px;background:var(--goldg);color:#fff;font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;letter-spacing:.5px}
.bpTarget{max-width:640px;margin:0 auto 10px;text-align:center;font-size:20px;font-weight:800;color:#7a4f12;background:linear-gradient(135deg,#fdf1d4,#f6dfa9);border-radius:18px;padding:12px 14px;box-shadow:var(--sh1)}
.bpTarget.flash{animation:tflash .5s var(--ease)}@keyframes tflash{0%{transform:scale(.92);background:#fff3c4}100%{transform:none}}
.bpArena{position:relative;max-width:640px;margin:0 auto;height:min(62vh,540px);border-radius:24px;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;
 background:radial-gradient(120% 80% at 50% 110%,#cfe9f5 0,#eaf6fb 45%,#fffaf0 100%);box-shadow:var(--sh2);border:1px solid #fff}
.bpArena::before{content:"☁️";position:absolute;font-size:60px;opacity:.5;top:12%;left:8%;animation:cloud 18s linear infinite}
.bpArena::after{content:"☁️";position:absolute;font-size:42px;opacity:.4;top:38%;right:6%;animation:cloud 24s linear infinite reverse}
@keyframes cloud{50%{transform:translateX(40px)}}
.bpCount{position:absolute;inset:0;display:grid;place-items:center;font-size:72px;font-weight:900;color:#c8892b;text-shadow:0 4px 0 #ecd5a0;z-index:2;animation:upIn .4s var(--ease)}
.bpB{position:absolute;bottom:-150px;cursor:pointer;animation:bpRise linear forwards;-webkit-tap-highlight-color:transparent;z-index:1}
.bpB .sw{position:relative;animation:sway ease-in-out infinite alternate}.bpB svg{display:block;width:100%;height:auto;filter:drop-shadow(0 6px 8px rgba(0,0,0,.15))}
.bpN{position:absolute;top:24%;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.9);border-radius:999px;padding:2px 8px;font-weight:800;font-size:13px;color:#2e2a26;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.12)}
@keyframes bpRise{to{transform:translateY(calc(-1 * min(62vh,540px) - 190px))}}
.bpB.pop{animation:none!important}.bpB.pop .sw{animation:popA .22s ease-out forwards}
.bpB.bad .sw{animation:shake .4s}
.bpPlus{position:absolute;z-index:3;font-weight:900;color:#3f8f6b;font-size:20px;transform:translateX(-50%);animation:plus .8s ease-out forwards;pointer-events:none}
@keyframes plus{to{transform:translate(-50%,-50px);opacity:0}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.tpz{max-width:1100px;margin:0 auto}
.tpPar{display:flex;justify-content:center;align-items:center;gap:10px}.tpPar .tps{width:170px}.tpH{color:#d9534f;font-size:18px}
.tpLine{width:2px;height:16px;background:#d9b670;margin:0 auto}
.tpGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;border-top:2px solid #d9b670;padding-top:12px}
.tpB{background:var(--glass);border:1px solid #fff;border-radius:18px;padding:8px;box-shadow:var(--sh1);display:flex;flex-direction:column;gap:6px}
.tpV{text-align:center;color:#d9534f;font-size:12px;line-height:1}
.tpK{display:flex;flex-direction:column;gap:6px;border-top:1px dashed #e3d0aa;padding-top:6px}.tpK small{color:var(--mut);font-size:11px;text-align:center}
.tps{display:flex;align-items:center;gap:8px;min-height:46px;padding:6px 8px;border-radius:14px;border:2px dashed #d9b670;background:rgba(255,250,238,.8);cursor:pointer;transition:transform .15s,background .2s}
.tps:not(.ok):hover{background:#fff3d6;transform:scale(1.02)}.tps .tq{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#f3e2bf;color:#b0731c;font-weight:800;flex:0 0 auto}
.tps span{font-size:13px;font-weight:600;color:var(--mut)}.tps.ok{border:2px solid transparent;background:#fff;box-shadow:var(--sh1)}.tps.ok span{color:var(--text);font-size:14px}.tps .av{width:32px;height:32px;font-size:14px}
.tps.pop{animation:cardIn .45s var(--ease)}.tps.shake{animation:shake .4s;border-color:#d9534f}
.tpTray{position:sticky;bottom:0;margin-top:14px;background:rgba(255,251,243,.95);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid #fff;border-radius:20px;box-shadow:0 -6px 24px rgba(90,60,20,.14);padding:8px 10px;z-index:5}
.tpTip{font-size:12.5px;color:var(--mut);text-align:center;margin-bottom:6px}.tpTip.flash{animation:tflash .5s;color:#b0731c;font-weight:700}
.tpChips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:thin}
.tpc{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:5px 12px 5px 6px;border-radius:999px;border:2px solid transparent;background:#fff;box-shadow:var(--sh1);cursor:pointer;font-family:inherit;font-weight:700;font-size:14px;color:var(--text);transition:transform .15s}
html[dir=rtl] .tpc{padding:5px 6px 5px 12px}.tpc .av{width:30px;height:30px;font-size:13px;box-shadow:none}.tpc.sel{border-color:#c8892b;transform:translateY(-3px);box-shadow:0 6px 16px rgba(200,137,43,.35)}
@media(max-width:700px){.tpTray{bottom:calc(84px + env(safe-area-inset-bottom))}.tpGrid{grid-template-columns:repeat(2,1fr);gap:8px}.tpPar .tps{width:44%}.bpTarget{font-size:17px}}
@media(max-width:700px){.bpArena{height:calc(100svh - 330px);min-height:360px}@keyframes bpRise{to{transform:translateY(calc(-100svh + 140px))}}}
</style>

<script>
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function tryKey(raw){const enc=b64(document.getElementById("enc").textContent.trim());
 const k=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
 const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:enc.slice(16,28)},k,enc.slice(28));return new TextDecoder().decode(pt)}
async function unlockData(){
 try{const st=localStorage.getItem("gk");if(st){return JSON.parse(await tryKey(b64(st)))}}catch(e){try{localStorage.removeItem("gk")}catch(_){}}
 const lock=document.getElementById("lock"),inp=document.getElementById("lockP"),err=document.getElementById("lockE");lock.style.display="flex";setTimeout(()=>inp.focus(),50);
 const salt=b64(document.getElementById("enc").textContent.trim()).slice(0,16);
 return new Promise(res=>{document.getElementById("lockF").onsubmit=async ev=>{ev.preventDefault();err.textContent="…";
  try{const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(inp.value.trim().normalize("NFC")),"PBKDF2",false,["deriveBits"]);
   const raw=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt,iterations:200000,hash:"SHA-256"},base,256));
   const data=JSON.parse(await tryKey(raw));try{localStorage.setItem("gk",btoa(String.fromCharCode(...raw)))}catch(e){}
   lock.style.display="none";res(data)}catch(e){err.textContent="סיסמה שגויה / Wrong password";inp.select()}}})}
</script>

let gStop=[];const stopG=()=>{gStop.forEach(f=>f());gStop=[]};

function popLevels(){stopG();const t=gt();
 ga().innerHTML=`<div class="gbar">${gBack()}</div><div class="gmenu">${t.popLv.map((x,i)=>`<button class="gcard" data-l="${i}"><span class="ge">${["🎈","♌","🔥"][i]}</span><b>${x}</b><small>${t.bestS}: ${gBest("popb"+i)??"–"}</small></button>`).join("")}</div>`;
 bindBack();ga().querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>startPop(+b.dataset.l))}
function startPop(L){stopG();const t=gt(),pool=withDates(),MON=m=>new Date(2001,m,1).toLocaleDateString(lang==="he"?"he-IL":"en-GB",{month:"long"});
 let score=0,left=40,combo=0,hits=0,target=null,running=false;
 ga().innerHTML=`<div class="gbar">${gBack()}<span>${t.left}: <b id="bpT">40</b></span><span>${t.score}: <b id="bpS">0</b></span></div><div class="bpTarget" id="bpG">${t.ready}</div><div class="bpArena" id="bpA"><div class="bpCount" id="bpC">3</div></div>`;bindBack();
 const A=document.getElementById("bpA"),G=document.getElementById("bpG");
 function newTarget(){const p=pool[Math.random()*pool.length|0];
  if(L===0)target={txt:t.popT(nm(p)),ok:q=>q.id===p.id};
  else if(L===1){const s=signIdx(p);target={txt:t.popS(`${GLY[s]} ${tr().signs[s]}`),ok:q=>signIdx(q)===s}}
  else if(Math.random()<.5){const a=ageNow(p);target={txt:t.popA(a),ok:q=>ageNow(q)===a}}else{const m=+p.g.slice(5,7)-1;target={txt:t.popM(MON(m)),ok:q=>+q.g.slice(5,7)-1===m}}
  G.innerHTML=target.txt;G.classList.remove("flash");void G.offsetWidth;G.classList.add("flash")}
 function spawn(){if(!running||!document.getElementById("tab-games").classList.contains("on"))return;const good=pool.filter(target.ok),p=Math.random()<.42&&good.length?good[Math.random()*good.length|0]:pool[Math.random()*pool.length|0];
  const b=document.createElement("div");b.className="bpB";const w=58+Math.random()*16,dur=Math.max(3.2,6.2-hits*.08)+Math.random()*1.2;
  b.style.cssText=`left:${3+Math.random()*80}%;animation-duration:${dur}s;width:${w}px`;b.innerHTML=`<div class="sw" style="animation-duration:${1.4+Math.random()}s">${balloonSVG(p.color,w)}<span class="bpN">${nm(p)}</span></div>`;
  b.addEventListener("pointerdown",e=>{e.preventDefault();if(b.dataset.done)return;b.dataset.done=1;const r=b.getBoundingClientRect();
   if(target.ok(p)){combo++;hits++;const add=10+Math.min(combo-1,5)*2;score+=add;SFX.pop();buzz(15);sparks(r.left+r.width/2,r.top+w*.5,p.color);
    const pl=document.createElement("div");pl.className="bpPlus";pl.textContent="+"+add;pl.style.cssText=`left:${b.offsetLeft+w/2}px;top:${b.offsetTop+20}px`;A.appendChild(pl);setTimeout(()=>pl.remove(),800);
    b.style.transform=getComputedStyle(b).transform;b.classList.add("pop");setTimeout(()=>b.remove(),250);if(L===0||hits%2===0)newTarget()}
   else{combo=0;score=Math.max(0,score-5);tone(180,0,.18,"sawtooth",.05,120);buzz([40,30,40]);b.classList.add("bad");setTimeout(()=>{delete b.dataset.done;b.classList.remove("bad")},420)}
   document.getElementById("bpS").textContent=score});
  b.addEventListener("animationend",e=>{if(e.animationName==="bpRise")b.remove()});A.appendChild(b)}
 let cd=3;const C=document.getElementById("bpC");SFX.tap();
 const cdI=setInterval(()=>{cd--;if(cd>0){C.textContent=cd;SFX.tap()}else{clearInterval(cdI);C.textContent=t.go;SFX.chime();setTimeout(()=>C.remove(),600);running=true;newTarget();loopSp()}},800);
 let spT=null;const loopSp=()=>{spawn();spT=setTimeout(loopSp,Math.max(380,820-hits*15))};
 const tick=setInterval(()=>{if(!running||!document.getElementById("tab-games").classList.contains("on"))return;left--;const T=document.getElementById("bpT");if(T)T.textContent=left;if(left<=5&&left>0)tone(880,0,.06,"sine",.05);if(left<=0)end()},1000);

 function end(){stopG();A.querySelectorAll(".bpB").forEach(b=>b.remove());const nb=gBest("popb"+L,score);

 ga().innerHTML=`<div class="gbar">${gBack()}</div><div class="gmenu">${t.tLv.map((x,i)=>{const b=gBest("treeb"+i);return `<button class="gcard" data-l="${i}"><span class="ge">${["🌱","🌳"][i]}</span><b>${x}</b><small>${t.bestS}: ${b?b+"s":"–"}</small></button>`}).join("")}</div>`;
 bindBack();ga().querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>startTree(+b.dataset.l))}
function startTree(L){stopG();clearInterval(gTimer);const t=gt(),hint=L===0,slots=[],yr=p=>p.g?p.g.slice(0,4):"";
 const S=(p,lab,pre,grp)=>{slots.push({id:p.id,lab,pre,grp});return slots.length-1};
 const par=D.par.map((n,i)=>S(byEn[n],t.par[i],hint,null));

 const todo=slots.map((s,i)=>i).filter(i=>!slots[i].pre),fill={},grpOf={};slots.forEach((s,i)=>{if(s.pre)fill[i]=s.id;if(s.grp)grpOf[s.id]=s.grp});

 const slotH=i=>{const s=slots[i];if(fill[i]){const p=P.find(q=>q.id===fill[i]);return `<div class="tps ok" data-s="${i}">${avHtml(p)}<span>${nm(p)}</span></div>`}

 const draw=()=>{const chips=chipIds.filter(id=>!placed.has(id));

  <div class="tpGrid">${brs.map(b=>`<div class="tpB">${slotH(b.sib)}${b.sp!=null?`<div class="tpV">♥</div>${slotH(b.sp)}`:""}${b.kids.length?`<div class="tpK"><small>${t.kids}</small>${b.kids.map(slotH).join("")}</div>`:""}</div>`).join("")}</div></div>
  <div class="tpTray"><div class="tpTip">${t.pick}</div><div class="tpChips">${chips.map(id=>{const p=P.find(q=>q.id===id);return `<button class="tpc${sel===id?" sel":""}" data-c="${id}">${avHtml(p)}<span>${nm(p)}</span></button>`}).join("")}</div></div>`;
  bindBack();updT();
  ga().querySelectorAll("[data-c]").forEach(b=>b.onclick=e=>{e.stopPropagation();sel=b.dataset.c;ga().querySelectorAll(".tpc").forEach(x=>x.classList.toggle("sel",x===b))});
  ga().querySelectorAll(".tps:not(.ok)").forEach(el=>el.onclick=()=>{if(sel==null){const tip=ga().querySelector(".tpTip");tip.classList.remove("flash");void tip.offsetWidth;tip.classList.add("flash");return}
   const i=+el.dataset.s,s=slots[i],ok=sel===s.id||(s.grp&&grpOf[sel]===s.grp);
   if(ok){fill[i]=sel;placed.add(sel);SFX.pop();buzz(12);const r=el.getBoundingClientRect();sparks(r.left+r.width/2,r.top+r.height/2,P.find(q=>q.id===sel).color);sel=null;
    if(todo.every(k=>fill[k]))return win();draw();const nel=ga().querySelector(`[data-s="${i}"]`);if(nel)nel.classList.add("pop")}
   else{mist++;tone(180,0,.18,"sawtooth",.05,120);buzz([40,30,40]);el.classList.remove("shake");void el.offsetWidth;el.classList.add("shake");const m=document.getElementById("tpM");if(m)m.textContent=mist}})};
 const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;const updT=()=>{const e=document.getElementById("tpT");if(e)e.textContent=fmt(Math.round((Date.now()-t0)/1000))};
 const ti=setInterval(updT,1000);gStop.push(()=>clearInterval(ti));
 function win(){stopG();const sec=Math.round((Date.now()-t0)/1000)+mist*5,nb=gBest("treeb"+L,sec,true);
  ga().innerHTML=`<div class="gbar">${gBack()}</div><div class="gwin"><div class="gbig">🌳</div><h3>${t.tDone}${nb?" "+t.newBest:""}</h3><p>${t.time}: ${fmt(Math.round((Date.now()-t0)/1000))} · ${t.mist}: ${mist}</p><p>${t.bestS}: ${gBest("treeb"+L)}s</p><div class="row"><button class="btn gold" id="gAgain">${t.again}</button><button class="btn" id="gLv">${t.back}</button></div></div>`;
  bindBack();document.getElementById("gAgain").onclick=()=>startTree(L);document.getElementById("gLv").onclick=treeLevels}
 draw()}
if(document.getElementById("tab-games").classList.contains("on"))gameMenu();
