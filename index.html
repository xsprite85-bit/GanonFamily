#title{font-family:"GTitle","Segoe UI",Arial,sans-serif;font-weight:700;font-size:36px;line-height:1.15;color:#c8892b;letter-spacing:.5px;text-shadow:2px 3px 0 #ecd5a0}
html[lang=en] #title{font-weight:400;font-size:34px}
#poster h1{font-family:"GTitle","Segoe UI",Arial,sans-serif;color:#b8861b;font-weight:700;font-size:16mm;text-shadow:.5mm .7mm 0 #e9d29a}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Segoe UI",Arial,"Noto Sans Hebrew",sans-serif;background:radial-gradient(1200px 700px at 80% -10%,#f6e6c6 0,transparent 60%),var(--bg);color:var(--text);min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;flex-wrap:wrap}
h1{font-size:22px;margin:0;font-weight:700;letter-spacing:.2px}
h1 small{display:block;color:var(--mut);font-weight:400;font-size:13px;margin-top:2px}
.btn{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:14px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.gold{background:var(--gold);color:#ffffff;border-color:var(--gold);font-weight:600}
.btn.sm{padding:5px 10px;font-size:12.5px}
.mk{color:var(--accent);font-size:11.5px;font-weight:700}
#upHint{display:none;align-items:center;justify-content:center;gap:6px;color:var(--mut);font-size:12px;padding:0 14px 8px}#upHint b{color:var(--gold);font-size:15px}
#upcoming{display:flex;gap:10px;overflow-x:auto;padding:18px 20px 14px;scrollbar-width:thin}
.up{flex:0 0 auto;min-width:300px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;cursor:pointer}
.up:hover{border-color:var(--accent)}
.up.today{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.up .t{font-size:12px;color:var(--mut)}
.up .body{display:grid;gap:2px}
.up .r{display:flex;justify-content:space-between;gap:14px;align-items:baseline}
.up .n{margin-bottom:2px}
.up .n{font-weight:600;font-size:15px}
.up .c{font-size:13px;color:var(--gold);font-variant-numeric:tabular-nums}
.av{position:relative;width:42px;height:42px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-weight:700;color:#2e2a26;background-size:cover;background-position:center;font-size:18px}
.av.crown::after{content:"👑";position:absolute;top:-16px;left:50%;transform:translateX(-50%) rotate(-8deg);font-size:21px;line-height:1}
#card .av.crown::after{top:-30px;font-size:38px}
nav{display:flex;gap:6px;padding:0 20px;flex-wrap:wrap}
nav button{background:transparent;color:var(--mut);border:0;border-bottom:2px solid transparent;padding:10px 14px;font-size:15px;cursor:pointer}
nav button.on{color:var(--text);border-bottom-color:var(--gold)}
main{padding:14px 20px 40px}
.tab{display:none}.tab.on{display:block}
#treeWrap,#zWrap{position:relative;background:linear-gradient(#fffaf0,#f4ead8);border:1px solid var(--line);border-radius:18px;overflow:hidden;height:min(72vh,640px);touch-action:none}
#tree,#zcv{width:100%;height:100%;display:block;cursor:grab}
#tree:active,#zcv:active{cursor:grabbing}
.ctrl{position:absolute;inset-block-end:12px;inset-inline-start:12px;display:flex;gap:6px}
.hint{position:absolute;inset-block-start:10px;inset-inline-end:14px;color:var(--mut);font-size:12.5px}
.lvl{position:absolute;inset-inline-start:14px;color:#a09481;font-size:12px}
#zwrap{max-width:640px;margin:0 auto}
#zsvg{width:100%;height:auto;display:block}
.cal{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.box h3{margin:0 0 8px;font-size:16px}
.box p{color:var(--mut);font-size:13.5px;line-height:1.55;margin:6px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.plist{display:grid;gap:8px;margin-top:6px}
.pl{display:flex;align-items:center;gap:10px;background:#f6eddc;border-radius:12px;padding:8px 10px}
.pl .n{flex:1;font-size:14px}
#dlg{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
#dlg.on{display:flex}
#card{background:var(--bg2);border:1px solid var(--line);border-radius:20px;max-width:440px;width:100%;max-height:92vh;overflow:auto;padding:20px}
#card .top{display:flex;gap:14px;align-items:center}
#card .av{width:78px;height:78px;font-size:32px}
#card h2{margin:0;font-size:20px}

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function tryKey(raw){const enc=b64(document.getElementById("enc").textContent.trim());
 const k=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
 const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:enc.slice(16,28)},k,enc.slice(28));return new TextDecoder().decode(pt)}
async function unlockData(){
 try{const st=localStorage.getItem("gk");if(st){return JSON.parse(await tryKey(b64(st)))}}catch(e){try{localStorage.removeItem("gk")}catch(_){}}
 const lock=document.getElementById("lock"),inp=document.getElementById("lockP"),err=document.getElementById("lockE");lock.style.display="flex";setTimeout(()=>inp.focus(),50);
 const salt=b64(document.getElementById("enc").textContent.trim()).slice(0,16);
 return new Promise(res=>{document.getElementById("lockF").onsubmit=async ev=>{ev.preventDefault();err.textContent="…";
  try{const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(inp.value.trim().normalize("NFC")),"PBKDF2",false,["deriveBits"]);
   const raw=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt,iterations:200000,hash:"SHA-256"},base,256));
   const data=JSON.parse(await tryKey(raw));try{localStorage.setItem("gk",btoa(String.fromCharCode(...raw)))}catch(e){}
   lock.style.display="none";res(data)}catch(e){err.textContent="סיסמה שגויה / Wrong password";inp.select()}}})}

const esc=s=>s.replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");
const ymd=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const AL=["-P6DT15H","-PT15H","PT9H"].map(t=>`BEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:Birthday\r\nTRIGGER:${t}\r\nEND:VALARM`).join("\r\n");
function ev(uid,date,summary,desc,rrule){return ["BEGIN:VEVENT",`UID:${uid}@ganon-family`,`DTSTAMP:${new Date().toISOString().replace(/[-:]/g,"").slice(0,15)}Z`,`DTSTART;VALUE=DATE:${ymd(date)}`,`DTEND;VALUE=DATE:${ymd(addDays(date,1))}`,`SUMMARY:${esc(summary)}`,`DESCRIPTION:${esc(desc)}`,rrule?`RRULE:${rrule}`:null,"TRANSPARENT".length?"TRANSP:TRANSPARENT":null,AL,"END:VEVENT"].filter(Boolean).join("\r\n")}
function buildICS(list,kind){
 const out=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Ganon Family//EN","CALSCALE:GREGORIAN","X-WR-CALNAME:ימי הולדת משפחה / Family birthdays","X-WR-TIMEZONE:Asia/Jerusalem"];
 list.forEach(p=>{
  const nameBoth=`${p.he} ${p.sh} / ${p.en} ${p.se}`.trim();
  if(kind!=="heb"){const g=nextGreg(p);if(g)out.push(ev(`g-${p.id}`,g.date,`🎂 יום הולדת – ${p.he} / ${p.en}'s birthday`,`${nameBoth}\n${fmtD(pd(p.g))}`,"FREQ=YEARLY"))}
  if(kind!=="greg"){const t0=today0();(p.hb||[]).forEach(([iso,age])=>{const d=pd(iso);if(d>=t0)out.push(ev(`h-${p.id}-${iso}`,d,`🕎 יום הולדת עברי – ${p.he} (${age}) / ${p.en}'s Hebrew birthday (${age})`,`${nameBoth}\n${p.hd_he} · ${p.hd_en}`,null))})}
 });
 out.push("END:VCALENDAR");return out.join("\r\n")}

let gTimer=null;const gt=()=>GT[lang],ga=()=>document.getElementById("gameArea");
const photoCount=()=>withDates().filter(p=>getPhoto(p)).length;
const bestOf=i=>{try{return localStorage.getItem("mbest"+i)||"–"}catch(e){return "–"}};
const gBack=()=>`<button class="btn sm" id="gBack">${gt().back}</button>`;
const bindBack=()=>{const b=document.getElementById("gBack");if(b)b.onclick=gameMenu};
function gameMenu(){clearInterval(gTimer);const t=gt();
 ga().innerHTML=`<div class="gmenu">${[["mem","🃏"],["quiz","❓"],["age","🎂"]].map(([k,e])=>`<button class="gcard" data-g="${k}"><span class="ge">${e}</span><b>${t[k]}</b><small>${t[k+"D"]}</small></button>`).join("")}</div>`;
 ga().querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>({mem:memLevels,quiz:startQuiz,age:startAge})[b.dataset.g]())}
function memLevels(){clearInterval(gTimer);const t=gt();
 ga().innerHTML=`<div class="gbar">${gBack()}</div><div class="gmenu">${t.lv.map((x,i)=>i===3&&photoCount()<6?"":`<button class="gcard" data-l="${i}"><span class="ge">${["🙂","🧠","🔥","📸"][i]}</span><b>${x}</b><small>${t.best}: ${bestOf(i)}</small></button>`).join("")}</div>`;
 bindBack();ga().querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>startMem(+b.dataset.l))}
function startMem(L){clearInterval(gTimer);const t=gt(),pick=[],seen=new Set(),src=L===3?withDates().filter(p=>getPhoto(p)):withDates(),n=Math.min(L===0?6:8,src.length);
 for(const p of shuf(src)){const key=L===0?signIdx(p):L===1?p.g.slice(5):p.id;if(seen.has(key))continue;seen.add(key);pick.push(p);if(pick.length===n)break}
 const dm=p=>p.g.slice(8)+"."+p.g.slice(5,7),heb=p=>lang==="he"?p.hd_he:p.hd_en;
 const cards=shuf(pick.flatMap(p=>{const nmH=`<span>${nm(p)}</span>`;
  const pr=L===0?[nmH,`<span style="font-size:1.9em;line-height:1">${GLY[signIdx(p)]}</span><br><span>${tr().signs[signIdx(p)]}</span>`]:L===1?[nmH,`<span>${dm(p)}</span>`]:L===3?[avHtml(p),nmH]:[`<span>${fmtD(pd(p.g))}</span>`,`<span>${heb(p)}</span>`];
  return [{k:p.id,h:pr[0]},{k:p.id,h:pr[1]}]}));
 const st={first:null,moves:0,m:0,t0:0,lock:false};
 ga().innerHTML=`<div class="gbar">${gBack()}<span>${t.moves}: <b id="gMv">0</b></span><span>${t.time}: <b id="gTm">0:00</b></span><span>${t.best}: <b>${bestOf(L)}</b></span></div><div class="mgrid lv${L}">${cards.map((c,i)=>`<div class="mc" data-i="${i}" data-k="${c.k}"><div class="in"><div class="bk">?</div><div class="fc">${c.h}</div></div></div>`).join("")}</div><div id="gEnd"></div>`;
 bindBack();const els=[...ga().querySelectorAll(".mc")],tm=document.getElementById("gTm");
 const tick=()=>{const s=Math.floor((Date.now()-st.t0)/1000);tm.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
 els.forEach((el,i)=>el.onclick=()=>{if(st.lock||el.classList.contains("f"))return;
  if(!st.t0){st.t0=Date.now();gTimer=setInterval(tick,500)}
  el.classList.add("f");if(st.first==null){st.first=i;return}
  const j=st.first;st.first=null;st.moves++;document.getElementById("gMv").textContent=st.moves;
  if(cards[j].k===cards[i].k){[j,i].forEach(x=>els[x].classList.add("ok"));st.m++;
   if(st.m===n){clearInterval(gTimer);tick();let nb=false;try{const b=+localStorage.getItem("mbest"+L);if(!b||st.moves<b){localStorage.setItem("mbest"+L,st.moves);nb=true}}catch(e){}
    document.getElementById("gEnd").innerHTML=`<div class="gwin"><div class="gbig">🎉</div><h3>${t.win}${nb?" 🏆":""}</h3><p>${t.moves}: ${st.moves} · ${t.time}: ${tm.textContent}</p><div class="row"><button class="btn gold" id="gAgain">${t.again}</button></div></div>`;
    document.getElementById("gAgain").onclick=()=>startMem(L)}}
  else{st.lock=true;setTimeout(()=>{[j,i].forEach(x=>els[x].classList.remove("f"));st.lock=false},900)}})}
function endBox(sc,max,again){const t=gt(),r=sc/max,m=t.g[r>=.95?4:r>=.8?3:r>=.6?2:r>=.4?1:0];
 ga().innerHTML=`<div class="gbar">${gBack()}</div><div class="gwin"><div class="gbig">${sc}/${max}</div><h3>${m}</h3><div class="row"><button class="btn gold" id="gAgain">${t.again}</button></div></div>`;bindBack();document.getElementById("gAgain").onclick=again}
function startQuiz(){clearInterval(gTimer);const t=gt(),P2=withDates(),qs=[],used=new Set();
 const months=[...Array(12)].map((_,i)=>new Date(2026,i,1).toLocaleDateString(lang==="he"?"he-IL":"en-GB",{month:"long"}));
 const mk=(c,pool)=>{const o=shuf([c,...shuf(pool.filter(x=>x!==c)).slice(0,3)]);return{o,a:o.indexOf(c)}};
 const kinds=["sign","month","who","older","young","age"];let guard=0;
 while(qs.length<10&&guard++<200){const k=kinds[Math.random()*kinds.length|0],S=shuf(P2);let q;
  if(k==="sign"){const p=S[0];q={q:t.qSign(nm(p)),...mk(tr().signs[signIdx(p)],tr().signs)}}
  else if(k==="month"){const p=S[0];q={q:t.qMonth(nm(p)),...mk(months[+p.g.slice(5,7)-1],months)}}
  else if(k==="who"){const p=S[0];q={q:t.qWho(fmtD(pd(p.g))),...mk(nm(p),S.slice(0,4).map(nm))}}
  else if(k==="older"){const [a,b]=S;if(a.g===b.g)continue;const o=shuf([a,b]);q={q:t.qOlder,o:o.map(nm),a:o.indexOf(a.g<b.g?a:b)}}
  else if(k==="young"){const f=S.slice(0,4);if(new Set(f.map(x=>x.g)).size<4)continue;const y=f.reduce((m,x)=>x.g>m.g?x:m);const o=shuf(f);q={q:t.qYoung,o:o.map(nm),a:o.indexOf(y)}}
  else{const p=S[0],c=ageNow(p),w=shuf([-5,-3,-2,-1,1,2,3,5].map(d=>c+d).filter(x=>x>=0)).slice(0,3),o=shuf([c,...w]);q={q:t.qAge(nm(p)),o:o.map(String),a:o.indexOf(c)}}
  if(used.has(q.q))continue;used.add(q.q);qs.push(q)}
 let i=0,sc=0;
 const show=()=>{const q=qs[i];ga().innerHTML=`<div class="gbar">${gBack()}<span>${t.qn} <b>${i+1}/${qs.length}</b></span><span>${t.score}: <b>${sc}</b></span></div><div class="gbox"><h3>${q.q}</h3><div class="gopts">${q.o.map((x,n)=>`<button class="gopt" data-n="${n}">${x}</button>`).join("")}</div><div class="gfb" id="gFb"></div><div class="row" id="gNx" style="justify-content:center"></div></div>`;bindBack();
  ga().querySelectorAll(".gopt").forEach(b=>b.onclick=()=>{const n=+b.dataset.n,ok=n===q.a;if(ok)sc++;
   ga().querySelectorAll(".gopt").forEach((x,m)=>{x.disabled=true;if(m===q.a)x.classList.add("good");else if(m===n)x.classList.add("bad")});
   document.getElementById("gFb").textContent=ok?t.ok:t.no;
   document.getElementById("gNx").innerHTML=`<button class="btn gold" id="gNext">${i+1<qs.length?t.next:t.finish}</button>`;
   document.getElementById("gNext").onclick=()=>{i++;i<qs.length?show():endBox(sc,qs.length,startQuiz)}})};
 show()}
function startAge(){clearInterval(gTimer);const t=gt(),pool=shuf(withDates()).slice(0,8);let r=0,sc=0;
 const show=()=>{const p=pool[r],a=ageNow(p);
  ga().innerHTML=`<div class="gbar">${gBack()}<span>${t.rt} <b>${r+1}/${pool.length}</b></span><span>${t.score}: <b>${sc}</b></span></div><div class="gbox">${avHtml(p)}<h3>${full(p)}</h3><div class="gbig" id="gV">30</div><input class="gslide" id="gS" type="range" min="0" max="95" value="30"><div class="gfb" id="gFb"></div><div class="row" id="gNx" style="justify-content:center"><button class="btn gold" id="gChk">${t.check}</button></div></div>`;bindBack();
  const S=document.getElementById("gS"),V=document.getElementById("gV");S.oninput=()=>V.textContent=S.value;
  document.getElementById("gChk").onclick=()=>{const g=+S.value,d=Math.abs(g-a),pt=Math.max(0,10-d);sc+=pt;S.disabled=true;
   document.getElementById("gFb").innerHTML=`${t.guess}: ${g} · ${t.actual}: <b style="color:var(--gold)">${a}</b> · +${pt} ${t.pts}`;
   document.getElementById("gNx").innerHTML=`<button class="btn gold" id="gNext">${r+1<pool.length?t.next:t.finish}</button>`;
   document.getElementById("gNext").onclick=()=>{r++;r<pool.length?show():endBox(sc,pool.length*10,startAge)}}};
 show()}

/* ---------- install as app (PWA) ---------- */
let deferredPrompt=null;
const isStandalone=()=>window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const isMobile=()=>/android|iphone|ipad|ipod|mobile/i.test(navigator.userAgent)||isIOS();
const instSeen=()=>{try{return localStorage.getItem("instNo")}catch(e){return null}};
function renderInstall(){const t=tr(),el=document.getElementById("inst");if(!el)return;
 document.getElementById("instT").textContent=t.instT;document.getElementById("instA").textContent=t.instA;document.getElementById("instI").textContent=t.instI;
 document.getElementById("instGo").textContent=t.instGo;document.getElementById("instNo").textContent=t.instNo;}
function showInstall(){const el=document.getElementById("inst");if(!el||isStandalone()||instSeen()||!isMobile())return;
 if(isIOS()){el.classList.add("ios","on")}else if(deferredPrompt){el.classList.remove("ios");el.classList.add("on")}}
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;setTimeout(showInstall,1500)});
window.addEventListener("appinstalled",()=>{document.getElementById("inst").classList.remove("on");deferredPrompt=null});
document.getElementById("instGo").onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();try{await deferredPrompt.userChoice}catch(e){}deferredPrompt=null;document.getElementById("inst").classList.remove("on")};
document.getElementById("instNo").onclick=()=>{document.getElementById("inst").classList.remove("on");try{localStorage.setItem("instNo","1")}catch(e){}};
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
renderInstall();setTimeout(showInstall,2500);
