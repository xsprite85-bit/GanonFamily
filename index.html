#title{font-family:"GTitle","Segoe UI",Arial,sans-serif;font-weight:700;font-size:36px;line-height:1.15;color:#c8892b;letter-spacing:.5px;text-shadow:2px 3px 0 #ecd5a0}
html[lang=en] #title{font-weight:400;font-size:34px}
#poster h1{font-family:"GTitle","Segoe UI",Arial,sans-serif;color:#b8861b;font-weight:700;font-size:16mm;text-shadow:.5mm .7mm 0 #e9d29a}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Segoe UI",Arial,"Noto Sans Hebrew",sans-serif;background:radial-gradient(1200px 700px at 80% -10%,#f6e6c6 0,transparent 60%),var(--bg);color:var(--text);min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;flex-wrap:wrap}
h1{font-size:22px;margin:0;font-weight:700;letter-spacing:.2px}
h1 small{display:block;color:var(--mut);font-weight:400;font-size:13px;margin-top:2px}
.btn{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:14px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.gold{background:var(--gold);color:#ffffff;border-color:var(--gold);font-weight:600}
.btn.sm{padding:5px 10px;font-size:12.5px}
.mk{color:var(--accent);font-size:11.5px;font-weight:700}
#upHint{display:none;align-items:center;justify-content:center;gap:6px;color:var(--mut);font-size:12px;padding:0 14px 8px}#upHint b{color:var(--gold);font-size:15px}
#upcoming{display:flex;gap:10px;overflow-x:auto;padding:18px 20px 14px;scrollbar-width:thin}
.up{flex:0 0 auto;min-width:300px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;cursor:pointer}
.up:hover{border-color:var(--accent)}
.up.today{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.up .t{font-size:12px;color:var(--mut)}
.up .body{display:grid;gap:2px}
.up .r{display:flex;justify-content:space-between;gap:14px;align-items:baseline}
.up .n{margin-bottom:2px}
.up .n{font-weight:600;font-size:15px}
.up .c{font-size:13px;color:var(--gold);font-variant-numeric:tabular-nums}
.av{position:relative;width:42px;height:42px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-weight:700;color:#2e2a26;background-size:cover;background-position:center;font-size:18px}
.av.crown::after{content:"👑";position:absolute;top:-16px;left:50%;transform:translateX(-50%) rotate(-8deg);font-size:21px;line-height:1}
#card .av.crown::after{top:-30px;font-size:38px}
nav{display:flex;gap:6px;padding:0 20px;flex-wrap:wrap}
nav button{background:transparent;color:var(--mut);border:0;border-bottom:2px solid transparent;padding:10px 14px;font-size:15px;cursor:pointer}
nav button.on{color:var(--text);border-bottom-color:var(--gold)}
main{padding:14px 20px 40px}
.tab{display:none}.tab.on{display:block}
#treeWrap,#zWrap{position:relative;background:linear-gradient(#fffaf0,#f4ead8);border:1px solid var(--line);border-radius:18px;overflow:hidden;height:min(72vh,640px);touch-action:none}
#tree,#zcv{width:100%;height:100%;display:block;cursor:grab}
#tree:active,#zcv:active{cursor:grabbing}
.ctrl{position:absolute;inset-block-end:12px;inset-inline-start:12px;display:flex;gap:6px}
.hint{position:absolute;inset-block-start:10px;inset-inline-end:14px;color:var(--mut);font-size:12.5px}
.lvl{position:absolute;inset-inline-start:14px;color:#a09481;font-size:12px}
#zwrap{max-width:640px;margin:0 auto}
#zsvg{width:100%;height:auto;display:block}
.cal{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.box h3{margin:0 0 8px;font-size:16px}
.box p{color:var(--mut);font-size:13.5px;line-height:1.55;margin:6px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.plist{display:grid;gap:8px;margin-top:6px}
.pl{display:flex;align-items:center;gap:10px;background:#f6eddc;border-radius:12px;padding:8px 10px}
.pl .n{flex:1;font-size:14px}
#dlg{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
#dlg.on{display:flex}
#card{background:var(--bg2);border:1px solid var(--line);border-radius:20px;max-width:440px;width:100%;max-height:92vh;overflow:auto;padding:20px}
#card .top{display:flex;gap:14px;align-items:center}
#card .av{width:78px;height:78px;font-size:32px}
#card h2{margin:0;font-size:20px}

#zPanel.on{display:block;animation:cardIn .45s var(--ease) both}

#zPanel .zh{display:flex;gap:12px;align-items:center}#zPanel .zg{font-size:40px;line-height:1;font-family:"Segoe UI Symbol",Arial;text-shadow:0 2px 6px rgba(0,0,0,.15)}
#zPanel .zh b{display:block;font-size:19px}#zPanel .zh small{color:var(--mut);font-size:12.5px}
#zPanel .zt{margin:10px 0 8px;padding:8px 10px;border-radius:12px;background:linear-gradient(135deg,#fbecc8,#f5dfae);color:#7a4f12;font-weight:600;font-size:13.5px;text-align:center}
#zPanel .zm{font-size:12.5px;color:var(--mut);margin:4px 2px 6px}
#zPanel .zl{display:grid;gap:6px}#zPanel .zi{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:12px;background:rgba(246,237,220,.7);cursor:pointer;transition:transform .15s}
#zPanel .zi:hover{transform:translateX(-3px);background:#f3e2bf}#zPanel .zi span{flex:1;font-weight:600;font-size:14px}#zPanel .zi small{color:var(--gold);font-weight:600}#zPanel .zi .av{width:34px;height:34px;font-size:15px}
#zPanel .zn{color:var(--mut);font-size:13px;text-align:center;padding:10px}
.ctrl .btn{white-space:nowrap}@media(max-width:700px){.ctrl{inset-inline-start:8px;inset-block-end:8px;gap:4px}.ctrl .btn.sm{padding:4px 9px;font-size:12px;min-height:28px}}

#pvw{position:fixed;inset:0;z-index:140;background:rgba(46,34,20,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:16px}
#pvw.on{display:flex;animation:fadeIn .25s ease both}
#pvw .pvIn{background:linear-gradient(180deg,#fffdf8,#f7eedd);border-radius:24px;box-shadow:0 30px 80px rgba(0,0,0,.4);width:min(1200px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;animation:cardIn .45s var(--ease) both}
#pvw .pvBar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;flex-wrap:wrap}#pvw .pvBar b{color:#b0731c;font-size:17px}
#pvw .pvB{display:flex;gap:8px;flex-wrap:wrap}
#pvw .pvStage{padding:0 16px 16px;overflow:auto;display:flex;justify-content:center;align-items:center;min-height:200px}
#pvw .pvCv{width:100%;height:auto;max-height:calc(100vh - 140px);object-fit:contain;border-radius:10px;box-shadow:0 8px 30px rgba(90,60,20,.25)}
#pvw .pvWait{color:var(--mut);padding:60px}
@media(max-width:700px){#posterBtn{display:inline-flex!important}#posterBtn .plb{display:none}#posterBtn{width:36px;height:36px;padding:0;align-items:center;justify-content:center}#pvw{padding:8px}#pvw .pvBar .btn{font-size:12.5px;padding:6px 10px}}
@media print{@page{size:A3 landscape;margin:0}#poster img{display:block;width:420mm;height:297mm}}
#pvw .pvTabs{display:flex;gap:6px}#pvw .pvGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;width:100%}#pvw .pvGrid img{width:100%;border-radius:8px;box-shadow:0 6px 20px rgba(90,60,20,.22);cursor:pointer;transition:transform .2s var(--ease)}#pvw .pvGrid img:hover{transform:translateY(-3px) scale(1.02)}
#pvw .pvStage{flex-direction:column;gap:10px}#pvw .pvNote{color:var(--mut);font-size:12.5px}
@media(max-width:700px){#pvw .pvGrid{grid-template-columns:repeat(2,1fr);gap:10px}}
</style>
</head>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function tryKey(raw){const enc=b64(document.getElementById("enc").textContent.trim());
 const k=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
 const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:enc.slice(16,28)},k,enc.slice(28));return new TextDecoder().decode(pt)}
async function unlockData(){
 try{const st=localStorage.getItem("gk");if(st){return JSON.parse(await tryKey(b64(st)))}}catch(e){try{localStorage.removeItem("gk")}catch(_){}}
 const lock=document.getElementById("lock"),inp=document.getElementById("lockP"),err=document.getElementById("lockE");lock.style.display="flex";setTimeout(()=>inp.focus(),50);
 const salt=b64(document.getElementById("enc").textContent.trim()).slice(0,16);
 return new Promise(res=>{document.getElementById("lockF").onsubmit=async ev=>{ev.preventDefault();err.textContent="…";
  try{const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(inp.value.trim().normalize("NFC")),"PBKDF2",false,["deriveBits"]);
   const raw=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt,iterations:200000,hash:"SHA-256"},base,256));
   const data=JSON.parse(await tryKey(raw));try{localStorage.setItem("gk",btoa(String.fromCharCode(...raw)))}catch(e){}
   lock.style.display="none";res(data)}catch(e){err.textContent="סיסמה שגויה / Wrong password";inp.select()}}})}

const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const isMobile=()=>/android|iphone|ipad|ipod|mobile/i.test(navigator.userAgent)||isIOS();
const instSeen=()=>{try{return localStorage.getItem("instNo")}catch(e){return null}};
function renderInstall(){const t=tr(),el=document.getElementById("inst");if(!el)return;
 document.getElementById("instT").textContent=t.instT;document.getElementById("instA").textContent=t.instA;document.getElementById("instI").textContent=t.instI;
 document.getElementById("instGo").textContent=t.instGo;document.getElementById("instNo").textContent=t.instNo;}
function showInstall(){const el=document.getElementById("inst");if(!el||isStandalone()||instSeen()||!isMobile())return;
 if(isIOS()){el.classList.add("ios","on")}else if(deferredPrompt){el.classList.remove("ios");el.classList.add("on")}}
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;setTimeout(showInstall,1500)});
window.addEventListener("appinstalled",()=>{document.getElementById("inst").classList.remove("on");deferredPrompt=null});
document.getElementById("instGo").onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();try{await deferredPrompt.userChoice}catch(e){}deferredPrompt=null;document.getElementById("inst").classList.remove("on")};
document.getElementById("instNo").onclick=()=>{document.getElementById("inst").classList.remove("on");try{localStorage.setItem("instNo","1")}catch(e){}};
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
renderInstall();setTimeout(showInstall,2500);

/* ================= premium FX layer: sound, haptics, balloons, confetti, intro ================= */
const LOGO=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" fill="#c8892b"/><circle cx="100" cy="100" r="78" fill="#faf5ec"/><path d="M142 66 A48 48 0 1 0 148 108 L148 102 L102 102" fill="none" stroke="#c8892b" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><path d="M100 138 V104 M100 118 L84 100 M100 112 L118 94" stroke="#8a5a2b" stroke-width="5" stroke-linecap="round"/><circle cx="84" cy="94" r="6" fill="#e0805f"/><circle cx="118" cy="88" r="6" fill="#e594b8"/><circle cx="100" cy="82" r="7" fill="#7fbf9a"/><circle cx="72" cy="110" r="5" fill="#6cb6c8"/><circle cx="128" cy="106" r="5" fill="#a99cdb"/></svg>`;
const FXT={he:{snd:"צלילים",party:"בלונים!",tap:"לחצו בכל מקום כדי להיכנס",today:"🎉 היום חוגגים!",next:"🎂 הבא/ה בתור",inD:n=>n===1?"מחר!":`בעוד ${n} ימים`,crowns:"👑 בחודש הקרוב",hb:"מזל טוב",welcome:"ברוכים הבאים"},
 en:{snd:"Sounds",party:"Balloons!",tap:"Tap anywhere to enter",today:"🎉 Celebrating today!",next:"🎂 Next up",inD:n=>n===1?"Tomorrow!":`in ${n} days`,crowns:"👑 Coming this month",hb:"Happy birthday",welcome:"Welcome"}};
const fxt=()=>FXT[lang]||FXT.he;
const reduceMo=matchMedia("(prefers-reduced-motion: reduce)").matches;
/* ---- sound ---- */
let AC=null,sndOn=(()=>{try{return localStorage.getItem("snd")!=="0"}catch(e){return true}})();
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(AC.state==="suspended")AC.resume();return AC}
function tone(f,t0,d,type="triangle",v=.12,f2){const a=ac();if(!a||!sndOn)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,a.currentTime+t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+t0+d);
 g.gain.setValueAtTime(0,a.currentTime+t0);g.gain.linearRampToValueAtTime(v,a.currentTime+t0+.012);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+t0+d);o.connect(g).connect(a.destination);o.start(a.currentTime+t0);o.stop(a.currentTime+t0+d+.05)}
function noise(t0,d,fq,v=.25,q=1.2){const a=ac();if(!a||!sndOn)return;const n=a.sampleRate*d,b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.5);
 const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;f.type="bandpass";f.frequency.value=fq;f.Q.value=q;g.gain.value=v;s.connect(f).connect(g).connect(a.destination);s.start(a.currentTime+t0)}
const SFX={
 tap:()=>tone(1250,0,.05,"sine",.05,900),
 tab:()=>{tone(660,0,.09,"sine",.05,990);noise(0,.12,2400,.04,.7)},
 pop:()=>{noise(0,.09,1500,.5,.9);tone(520,0,.08,"square",.04,160)},
 chime:()=>[1046.5,1318.5,1568].forEach((f,i)=>tone(f,i*.08,.5,"sine",.07)),
 fanfare:()=>[523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,i*.11,i===3?.9:.25,"triangle",.1)),
 bday:()=>{const N={G4:392,A4:440,B4:493.88,C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99},B=.3;
  const m=[["G4",.75],["G4",.25],["A4",1],["G4",1],["C5",1],["B4",2],["G4",.75],["G4",.25],["A4",1],["G4",1],["D5",1],["C5",2],["G4",.75],["G4",.25],["G5",1],["E5",1],["C5",1],["B4",1],["A4",2],["F5",.75],["F5",.25],["E5",1],["C5",1],["D5",1],["C5",2.5]];
  let t=0;m.forEach(([n,d])=>{tone(N[n],t,d*B*1.1,"triangle",.09);tone(N[n]*2,t,d*B*.6,"sine",.02);t+=d*B})}
};
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
/* ---- balloons ---- */
const fx=document.createElement("div");fx.id="fx";document.body.appendChild(fx);
const BC=["#e0805f","#e594b8","#7fbf9a","#6cb6c8","#a99cdb","#e3a647","#e8c14a","#d9534f"];
function balloonSVG(c,w){const h=w*1.25;return `<svg width="${w}" height="${h+70}" viewBox="0 0 100 195"><defs><radialGradient id="bg${c.slice(1)}" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset=".25" stop-color="${c}"/><stop offset="1" stop-color="${c}" stop-opacity=".95"/></radialGradient></defs>
<path d="M50 125 Q44 145 54 160 T48 195" stroke="#b9a58a" stroke-width="1.6" fill="none"/><ellipse cx="50" cy="62" rx="44" ry="56" fill="url(#bg${c.slice(1)})"/><path d="M44 117 L56 117 L50 126Z" fill="${c}"/><ellipse cx="34" cy="38" rx="9" ry="15" fill="#fff" opacity=".35" transform="rotate(-25 34 38)"/></svg>`}
function sparks(x,y,c){for(let i=0;i<12;i++){const s=document.createElement("i");s.className="spark";const a=Math.PI*2*i/12,r=40+Math.random()*30;s.style.cssText=`left:${x-4}px;top:${y-4}px;background:${i%2?c:"#ffd76a"};--dx:${Math.cos(a)*r}px;--dy:${Math.sin(a)*r}px`;fx.appendChild(s);setTimeout(()=>s.remove(),650)}}
function balloons(n=6,spread=1){if(reduceMo)return;for(let i=0;i<n;i++)setTimeout(()=>{const b=document.createElement("div");b.className="bln";const c=BC[Math.random()*BC.length|0],w=46+Math.random()*34*spread,dur=7+Math.random()*5;
 b.style.cssText=`left:${4+Math.random()*86}%;animation-duration:${dur}s`;b.innerHTML=`<div class="sw" style="animation-duration:${1.6+Math.random()*1.4}s">${balloonSVG(c,w)}</div>`;
 b.addEventListener("pointerdown",e=>{e.stopPropagation();e.preventDefault();if(b.classList.contains("pop"))return;const r=b.getBoundingClientRect();const st=getComputedStyle(b).transform;b.style.transform=st;b.classList.add("pop");SFX.pop();buzz(18);sparks(r.left+r.width/2,r.top+w*.6,c);setTimeout(()=>b.remove(),260)});
 b.addEventListener("animationend",e=>{if(e.target===b)b.remove()});fx.appendChild(b)},i*(260+Math.random()*240))}
/* ---- confetti ---- */
const fxCv=document.createElement("canvas");fxCv.id="fxc";document.body.appendChild(fxCv);const cx2=fxCv.getContext("2d");let CF=[],cfRun=false;
function confetti(n=160,ox=.5,oy=.35){if(reduceMo)return;const W=fxCv.width=innerWidth*devicePixelRatio,H=fxCv.height=innerHeight*devicePixelRatio;
 for(let i=0;i<n;i++){const a=-Math.PI/2+(Math.random()-.5)*Math.PI*1.1,v=(9+Math.random()*12)*devicePixelRatio;CF.push({x:W*ox,y:H*oy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,s:(5+Math.random()*6)*devicePixelRatio,r:Math.random()*6,vr:(Math.random()-.5)*.35,c:BC[i%BC.length],sh:i%3,l:1})}
 if(!cfRun){cfRun=true;requestAnimationFrame(cfStep)}}
function cfStep(){cx2.clearRect(0,0,fxCv.width,fxCv.height);const g=.42*devicePixelRatio;CF.forEach(p=>{p.vy+=g;p.vx*=.985;p.vy*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;if(p.vy>0)p.l-=.006;
 cx2.save();cx2.globalAlpha=Math.max(0,p.l);cx2.translate(p.x,p.y);cx2.rotate(p.r);cx2.fillStyle=p.c;if(p.sh===0)cx2.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);else if(p.sh===1){cx2.beginPath();cx2.arc(0,0,p.s/2.6,0,7);cx2.fill()}else{cx2.scale(1,Math.cos(p.r*2));cx2.fillRect(-p.s/2,-p.s/2,p.s,p.s)}cx2.restore()});
 CF=CF.filter(p=>p.l>0&&p.y<fxCv.height+40);if(CF.length)requestAnimationFrame(cfStep);else{cfRun=false;cx2.clearRect(0,0,fxCv.width,fxCv.height)}}
/* ---- party logic ---- */
function partyInfo(){const up=upcomingPeople(true),t0=today0().getTime();return{up,t0,today:up.filter(u=>u.k===t0),near:up.filter(u=>u.k>t0&&u.k<=t0+30*864e5)}}
function bigParty(sound=true){confetti(200,.5,.3);setTimeout(()=>confetti(120,.15,.5),350);setTimeout(()=>confetti(120,.85,.5),650);balloons(14);buzz([30,60,30,60,80]);if(sound)SFX.bday()}
function smallParty(){balloons(5);SFX.chime()}
/* ---- header: logo, mute, party ---- */
(function(){const h=document.querySelector("header"),t=document.getElementById("title");const br=document.createElement("div");br.className="brand";const lg=document.createElement("div");lg.className="lg";lg.innerHTML=LOGO;
 t.parentNode.insertBefore(br,t);br.appendChild(lg);br.appendChild(t);lg.onclick=()=>{balloons(6);SFX.chime();buzz(12)};
 const bx=h.querySelector("#langBtn").parentNode;bx.classList.add("hbtns");
 const pb=document.createElement("button");pb.className="btn ico";pb.id="partyBtn";pb.textContent="🎈";pb.onclick=()=>{const i=partyInfo();i.today.length?bigParty():(balloons(8),SFX.fanfare());buzz(15)};
 const mb=document.createElement("button");mb.className="btn ico";mb.id="sndBtn";const upd=()=>{mb.textContent=sndOn?"🔊":"🔇";mb.title=fxt().snd;pb.title=fxt().party};upd();
 mb.onclick=()=>{sndOn=!sndOn;try{localStorage.setItem("snd",sndOn?"1":"0")}catch(e){}upd();if(sndOn)SFX.chime()};bx.insertBefore(pb,bx.firstChild);bx.insertBefore(mb,bx.firstChild);
 document.getElementById("langBtn").addEventListener("click",()=>setTimeout(upd,0))})();
/* ---- global taps & haptics ---- */
document.addEventListener("pointerdown",()=>ac(),{once:true,capture:true});
document.addEventListener("click",e=>{const b=e.target.closest("button,.up,.gcard,.ym .it,.arow,.acol,.mc,.gopt");if(!b||b.id==="sndBtn"||b.id==="partyBtn")return;
 if(b.closest("#tabs")){SFX.tab();buzz(10)}else{SFX.tap();buzz(6)}},true);
/* ---- card open hook ---- */
const _openCard=openCard;openCard=function(id){_openCard(id);if(!CROWN.has(id))return;if(CROWN.get(id)){confetti(140,.5,.25);SFX.bday();buzz([30,50,30])}else{balloons(4);SFX.chime()}};
/* ---- game win ---- */
new MutationObserver(()=>{const w=document.querySelector("#gameArea .gwin:not([data-fx])");if(w){w.dataset.fx=1;confetti(170,.5,.4);SFX.fanfare();buzz([20,40,20])}}).observe(document.getElementById("gameArea"),{childList:true,subtree:true});
/* ---- upcoming entrance ---- */
(function(){const u=document.getElementById("upcoming");u.classList.add("anim");setTimeout(()=>u.classList.remove("anim"),1600)})();
/* ---- intro ---- */
(function(){const P0=partyInfo();let seen=false;try{seen=sessionStorage.getItem("intro")==="1"}catch(e){}
 const afterIntro=(gesture)=>{let k="fx"+P0.t0;let done=false;try{done=sessionStorage.getItem(k)==="1";sessionStorage.setItem(k,"1")}catch(e){}if(done)return;
  if(P0.today.length)setTimeout(()=>bigParty(gesture),300);else if(P0.near.length)setTimeout(()=>{balloons(5);if(gesture)SFX.chime()},500)};
 if(seen||reduceMo){afterIntro(false);return}
 const f=fxt(),d=new Date();let dt="";try{dt=d.toLocaleDateString(lang==="he"?"he-IL":"en-GB",{weekday:"long",day:"numeric",month:"long"})+" · "+new Intl.DateTimeFormat((lang==="he"?"he":"en")+"-u-ca-hebrew",{day:"numeric",month:"long",year:"numeric"}).format(d)}catch(e){}
 let hl="";if(P0.today.length)hl=`<b>${f.today}</b><span>${f.hb} ${P0.today.map(u=>nm(u.p)).join(", ")}! 🎂</span>`;
 else if(P0.up.length){const u=P0.up[0],n=Math.round((u.k-P0.t0)/864e5);hl=`<b>${f.next}</b><span>${nm(u.p)} · ${f.inD(n)}</span>`;if(P0.near.length>1)hl+=`<span style="color:var(--mut);font-size:13px">${f.crowns}: ${P0.near.map(u=>nm(u.p)).join(" · ")}</span>`}
 const el=document.createElement("div");el.id="intro";el.innerHTML=`<div class="il">${LOGO}</div><h2>${tr().title}</h2><div class="dt">${dt}</div>${hl?`<div class="hl">${hl}</div>`:""}<div class="go">${f.tap}</div>`;
 document.body.appendChild(el);if(P0.today.length||P0.near.length)setTimeout(()=>balloons(P0.today.length?8:4),700);
 let gone=false;const close=g=>{if(gone)return;gone=true;try{sessionStorage.setItem("intro","1")}catch(e){}if(g){ac();SFX.chime();buzz(12)}el.classList.add("out");setTimeout(()=>el.remove(),650);afterIntro(g)};
 el.addEventListener("click",()=>close(true));setTimeout(()=>close(false),6500)})();


})();</script>
